[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trajcp"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "scipy", "jaxtyping"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "mps: needs an Apple GPU",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These executable scripts must set backend environment variables before importing the backend.
"scripts/00_time_p5.py" = ["E402"]
"scripts/00_verify_m3.py" = ["E402"]
"scripts/01_generate.py" = ["E402"]
"scripts/02_audit_p2_refinement.py" = ["E402"]
