[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trajcp"
dynamic = ["version"]
description = "Trajectory-level conformal prediction bands for autoregressive neural PDE emulators"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Shrestha" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  # Emulator training and batched rollouts: eager float32 on the Apple GPU, never compiled.
  "torch>=2.13",
  # Reference solutions: JAX on the CPU in float64 (enabled in code), Exponax solvers.
  "jax>=0.5",
  "exponax>=0.2",
  # Numerical core and calibration arithmetic: float64 on the CPU.
  "numpy>=2.5",
  "scipy>=1.18",
  "scikit-learn>=1.9",
  "threadpoolctl>=3.5",
  # Storage and configuration.
  "polars>=1.0",
  "pyarrow>=24",
  "zarr>=3",
  "safetensors>=0.8",
  "cryptography>=49",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  # Figures.
  "matplotlib>=3.9",
  "SciencePlots>=2.1",
]

[project.optional-dependencies]
# Optional speed path for rollouts (Apple silicon only).
mlx = ["mlx>=0.32.4; sys_platform == 'darwin'"]
# Gradient-boosted trees; needs the OpenMP runtime (libomp) on macOS.
xgboost = ["xgboost>=3.4"]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "mypy>=1.13",
]
# Document-processing helpers used by project tooling; pinned to the tested versions.
tooling = [
  "pylatexenc==2.11",
  "pypdf==6.21.2",
]
# Third-party conformal library used only as a test oracle (not part of the default install).
# puncc 0.9.3 requires numpy<2 and cannot be installed next to the pinned numpy.
oracles = [
  "mapie>=1.6",
]

[tool.hatch.version]
path = "src/trajcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trajcp"]

[tool.uv]
default-groups = ["dev", "tooling"]
# One lock for the two supported platforms.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Exact versions of the libraries the registered comparison study was tested with.
constraint-dependencies = [
  "numpy==2.5.0",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "pyarrow==24.0.0",
  "cryptography==49.0.0",
  "safetensors==0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/trajcp/conformal"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "nightly: long-running validation (for example the 10,000-split coverage simulations)",
  "mps: needs an Apple GPU",
  "oracle: cross-checks against optional third-party conformal libraries",
]
